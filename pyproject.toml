[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transpect-trace"
version = "0.3.1"
description = "Evidence-first tracing for real LLM agent clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
export = ["pyarrow>=17,<20"]

[dependency-groups]
dev = ["nltk>=3.9,<4", "pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
ttrace = "transpect_trace.cli:main"
ttrace-gateway = "transpect_trace.gateway.server:main"
ttrace-agent = "transpect_trace.clients.codex_entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transpect_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
