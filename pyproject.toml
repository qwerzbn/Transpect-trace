[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transpect-trace"
version = "0.3.1"
description = "Windows Codex request gating, TLS observation and behavior evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "h11>=0.14,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
guard-probe = ["cryptography>=43,<46"]
native-build = ["ziglang==0.13.0"]
observe = ["hpack>=4.1,<5", "hyperframe>=6.1,<7"]
tui = ["pywinpty==3.0.5; sys_platform == 'win32'"]
[dependency-groups]
dev = ["cryptography>=43,<46", "h2>=4.3,<5", "jsonschema>=4.23,<5", "pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
ttrace = "transpect_trace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transpect_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
