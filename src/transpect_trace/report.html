<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transpect · Agent 追踪</title>
<style>
:root{color-scheme:light;--ink:#142c3e;--muted:#607687;--line:#dbe4e9;--blue:#166fbe;--green:#168269}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}header{background:#102b3d;color:white;padding:25px 32px}header small{color:#a8c9dc;letter-spacing:2px}h1{font-size:27px;margin:4px 0}h2{font-size:17px;margin:0 0 14px}p{margin:5px 0}main{padding:22px 28px;max-width:1800px;margin:auto}.subtitle{color:#a8c9dc;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat,.panel{border:1px solid var(--line);border-radius:10px;background:white}.stat{padding:14px 18px;color:var(--muted)}.stat b{display:block;font-size:26px;color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(260px, .8fr) minmax(480px,1.7fr) minmax(300px,1fr);gap:16px;align-items:start}.panel{padding:18px;min-width:0}.tabs{display:flex;gap:5px;margin:12px 0;flex-wrap:wrap}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;color:var(--ink)}button:hover,button.active{background:#e9f4ff;border-color:#95bada;color:#115e9c}.muted{color:var(--muted);font-size:12px}.tree{max-height:650px;overflow:auto}.tree details{margin:5px 0 5px 10px;border-left:1px solid var(--line);padding-left:8px}.tree summary{cursor:pointer}.node{display:block;text-align:left;margin:5px 0;width:100%;overflow-wrap:anywhere;font-size:12px}.file{display:block;text-align:left;width:100%;margin:6px 0;padding:10px}.badge{display:inline-block;font-size:11px;border-radius:4px;padding:1px 5px;background:#edf3f6;color:#466579;margin:2px}#files{max-height:390px;overflow:auto}.file.selected{border-color:var(--blue);background:#f1f8ff}#graph{overflow:auto;min-height:240px;margin:8px 0;background:#f8fafc;border-radius:8px;border:1px solid var(--line)}svg text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px}svg g{cursor:pointer}svg g:hover rect{stroke:#166fbe;stroke-width:2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,monospace;background:#f4f7f9;border-radius:6px;padding:12px;max-height:710px;overflow:auto;margin:0}#timeline{max-height:340px;overflow:auto}.event{display:flex;gap:12px;border-bottom:1px solid #edf1f4;padding:8px 0;cursor:pointer}.event:hover{background:#f1f8ff}.event time{color:var(--muted);font-size:11px;min-width:100px}.event span{overflow-wrap:anywhere;font-size:12px}.wide{margin-top:16px}.notice{padding:12px 16px;border-left:3px solid #d29d3a;background:#fff9ed;margin-bottom:16px;font-size:12px}input{width:100%;border:1px solid var(--line);border-radius:5px;padding:7px}details>summary{font-weight:600}#evidence-title{overflow-wrap:anywhere}@media(max-width:1150px){.layout{grid-template-columns:1fr 1.7fr}.evidence{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){main{padding:12px}.layout{display:block}.panel{margin-bottom:12px}.stats{grid-template-columns:repeat(2,1fr)}}
#graph{max-height:540px}.tree summary{overflow-wrap:anywhere}
</style>
<header><small>TRANSPECT / EXECUTION EVIDENCE</small><h1>一次任务，完整展开</h1><div class="subtitle" id="run"></div></header>
<main><div class="stats" id="stats"></div><div class="notice" id="notice"></div>
<details class="panel" style="margin-bottom:16px"><summary>输入任务与追踪边界</summary><p id="prompt"></p><ul id="limits"></ul><p class="muted" id="root"></p></details>
<div class="layout"><section class="panel"><h2>执行结构</h2><div class="tabs"><button id="agent-tab" class="active">Agent 调用树</button><button id="process-tab">系统进程树</button></div><label class="muted"><input id="threads" type="checkbox" style="width:auto"> 显示系统线程 / Gateway 进程</label><div class="tree" id="tree"></div></section>
<section class="panel"><h2>数据去了哪里</h2><input id="search" placeholder="筛选文件，例如 budget.csv"><div id="files"></div><p class="muted" id="flow-caption">选择文件查看读取和传递证据。边上的“原文匹配”表示来源候选，不等于完整语义溯源。</p><div id="graph"></div></section>
<section class="panel evidence"><h2 id="evidence-title">证据详情</h2><p class="muted">点击节点、时间线或图中的连线。请求正文只预览前 12,000 字符，完整内容保存在证据包的 blob 中。</p><pre id="evidence">请选择一个节点</pre></section></div>
<section class="panel wide"><h2>时间线 <span class="muted">UTC · 实际采集时间</span></h2><div id="timeline"></div></section>
</main><script id="trace-data" type="application/json">__TRACE_DATA__</script><script>
'use strict';
const d=JSON.parse(document.getElementById('trace-data').textContent), $=id=>document.getElementById(id);
const nodeMap=new Map(d.nodes.map(n=>[n.id,n]));let mode='agent',selected=null;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function inspect(id,value){$('evidence-title').textContent=nodeMap.get(id)?.label||id;$('evidence').textContent=JSON.stringify(value||d.details[id]||{id,note:'详见原始证据包'},null,2)}
function btn(id,label){const b=el('button',label,'node');b.onclick=()=>inspect(id);return b}
$('run').textContent=d.manifest.client+' / '+d.manifest.model+' · '+d.manifest.run_id;
for(const [label,value] of [['初始及生成文件',d.files.length],['观察到读取',d.files.filter(f=>f.reads.length).length],['模型请求',d.requests.length],['工具调用',d.tools.length],['Agent',d.agents.length]]){const s=el('div',undefined,'stat');s.append(el('b',String(value)),el('span',label));$('stats').append(s)}
$('notice').textContent='运行状态：'+d.manifest.status+' ｜证据质量：'+(d.quality.status||'未评估')+' ｜静态回放报告；本地工具回执不代表互联网外发。';
$('prompt').textContent=d.prompt;for(const v of d.limits)$('limits').append(el('li',v));$('root').textContent='证据目录：'+d.evidence_root;
function drawTree(){const tree=$('tree');tree.replaceChildren();$('agent-tab').className=mode==='agent'?'active':'';$('process-tab').className=mode==='process'?'active':'';
if(mode==='agent'){const seen=new Set();function agent(a,parent){if(seen.has(a.id))return;seen.add(a.id);const box=el('details');box.open=true;box.append(el('summary',a.label));box.append(btn(a.id,a.thread_id?'Thread '+a.thread_id:'查看 Agent 证据'));for(const id of a.children)box.append(btn(id,nodeMap.get(id)?.label||id));const rq=el('details');rq.append(el('summary','模型请求 ('+a.requests.length+')'));for(const id of a.requests)rq.append(btn(id,nodeMap.get(id)?.label||id));box.append(rq);for(const child of d.agents.filter(c=>c.parent===a.id))agent(child,box);parent.append(box)}for(const a of d.agents.filter(a=>!a.parent))agent(a,tree)}
else{const all=$('threads').checked,visible=d.processes.filter(p=>all||(!p.thread&&p.scope==='agent')),ids=new Set(visible.map(p=>p.id)),seen=new Set(),pm=new Map(d.processes.map(p=>[p.id,p]));function parentId(p){let id=p.parent;const visited=new Set();while(id&&!ids.has(id)&&!visited.has(id)){visited.add(id);id=pm.get(id)?.parent}return id}function proc(p,parent,depth){if(seen.has(p.id)||depth>80)return;seen.add(p.id);const box=el('details');box.open=depth<4;box.append(el('summary',(p.thread?'线程 · ':'')+p.label));box.append(btn(p.id,p.scope+' · '+(p.files.length?'读取 '+p.files.join(', '):'进程证据')));for(const c of visible.filter(c=>parentId(c)===p.id))proc(c,box,depth+1);parent.append(box)}for(const p of visible.filter(p=>!ids.has(parentId(p))))proc(p,tree,0);for(const p of visible)if(!seen.has(p.id))proc(p,tree,0)} }
$('agent-tab').onclick=()=>{mode='agent';drawTree()};$('process-tab').onclick=()=>{mode='process';drawTree()};$('threads').onchange=drawTree;
function renderFiles(){const q=$('search').value.toLowerCase();$('files').replaceChildren();for(const f of d.files.filter(f=>f.path.toLowerCase().includes(q))){const b=el('button',undefined,'file'+(selected===f.id?' selected':''));b.append(el('strong',f.path),el('br'));for(const t of [f.read_status,'模型请求 '+new Set(f.requests.map(x=>x.target)).size,'工具/接收端 '+new Set(f.tools.map(x=>x.target)).size])b.append(el('span',t,'badge'));b.onclick=()=>{selected=f.id;inspect(f.id);renderFiles();drawFlow(f)};$('files').append(b)}}
const NS='http://www.w3.org/2000/svg';function svgEl(tag,attrs,text){const x=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;return x}
function drawFlow(f){const outgoing=d.edges.filter(e=>e.source===f.id),targets=[...new Set(outgoing.map(e=>e.target))],h=Math.max(240,targets.length*83+45),svg=svgEl('svg',{width:760,height:h,viewBox:'0 0 760 '+h});const defs=svgEl('defs',{}),marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#6a91ae'}));defs.append(marker);svg.append(defs);const positions=new Map([[f.id,[12,h/2-25]]]);targets.forEach((id,i)=>positions.set(id,[400,25+i*83]));
function box(id,x,y){const n=nodeMap.get(id)||{label:id,kind:'unknown'},g=svgEl('g',{});g.append(svgEl('rect',{x,y,width:320,height:48,rx:7,fill:n.kind==='file'?'#e7f4ef':n.kind==='process'?'#eef2f6':'#e8f2ff',stroke:'#b8cddd'}));const text=svgEl('text',{x:x+12,y:y+21},n.label.length>40?n.label.slice(0,39)+'…':n.label);g.append(text,svgEl('text',{x:x+12,y:y+38,fill:'#607687','font-size':10},n.kind));g.onclick=()=>inspect(id);svg.append(g)}
for(const id of targets){const [x,y]=positions.get(id),sy=h/2;const path=svgEl('path',{d:`M332 ${sy} C365 ${sy},365 ${y+24},398 ${y+24}`,fill:'none',stroke:'#6a91ae','stroke-width':1.5,'marker-end':'url(#arrow)'});path.onclick=()=>inspect('关联证据',outgoing.filter(e=>e.target===id));svg.append(path);const es=outgoing.filter(e=>e.target===id);svg.append(svgEl('text',{x:405,y:y-6,fill:'#557184','font-size':10},es[0].label+' · '+es.length+' 条证据'))}for(const [id,[x,y]]of positions)box(id,x,y);$('graph').replaceChildren(svg);$('flow-caption').textContent=f.path+'：'+targets.length+' 个有证据的读取/内容匹配目标。点击连线查看判定依据。';}
$('search').oninput=renderFiles;
for(const e of d.timeline){const row=el('div',undefined,'event');row.append(el('time',e.time.slice(11,23)),el('span',e.label));row.onclick=()=>inspect(e.id);$('timeline').append(row)}
drawTree();renderFiles();const first=d.files.find(f=>f.reads.length)||d.files[0];if(first){selected=first.id;renderFiles();drawFlow(first)}
</script></html>
