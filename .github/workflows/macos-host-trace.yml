name: macOS host trace

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: "@openai/codex npm version"
        default: "0.114.0"

jobs:
  trace:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Trace Codex through the local Gateway
        run: bash scripts/macos-host-trace.sh
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          MODEL_ID: ${{ secrets.MODEL_ID }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-trace
          path: runs/host/
          if-no-files-found: warn
