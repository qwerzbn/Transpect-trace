name: Python contracts and repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - name: Install locked development dependencies
        run: uv sync --locked --dev --extra observe
      - name: Check dependency lock and environment
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
      - name: Check public contracts and source layout
        run: |
          uv run --no-sync python scripts/generate_schemas.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python scripts/check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python scripts/audit_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Run unit and protocol regressions
        run: uv run --no-sync pytest
      - name: Build Python wheel only
        run: uv build --wheel --out-dir build/ci-wheel
      - name: Check wheel contents
        run: |
          $wheel = Get-ChildItem -LiteralPath build/ci-wheel -Filter *.whl | Select-Object -First 1
          uv run --no-sync python scripts/check_repository.py --wheel $wheel.FullName
